name: CI

# Spec A7. Runs on pushes to main that touch shippable code, on pull requests, and on demand.
# paths-ignore keeps documentation-only commits from spending a full 20-minute runner slot:
# the heavy step here is the end-to-end suite, which downloads Chrome and drives three browsers.
# Push several commits at once rather than one at a time — concurrency cancels superseded runs,
# but each push still starts a run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `cache: npm` on purpose: that option resolves its cache key from a
          # lockfile and fails the step with "Dependencies lock file is not found"
          # when there is none. See the actions/cache step below and
          # docs/RELEASING.md for why this repository carries no package-lock.json.

      - name: Restore npm and puppeteer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dev dependencies
        # `npm ci` requires a lockfile and exits EUSAGE without one.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Check that content.js matches src/
        run: |
          if [ -f tools/build.js ]; then
            node tools/build.js --check
          else
            echo "::notice::tools/build.js not present yet (spec A2) - skipping build --check"
          fi

      - name: Static validation
        run: node tools/validate.js

      # SPEC-arsenal §F6: 밸런스를 문서가 아니라 실행 가능한 검사로 만든다 — 밸런스 회귀가 테스트로 잡힌다.
      # tools/balance.js 는 src/ 의 무기 표를 정적으로 파싱해 §F6 의 위반 다섯 가지와 §F5 의 역할 겹침을
      # 검사하고, 사람이 읽을 표인 docs/BALANCE.md 가 그 표와 어긋나 있으면 함께 실패한다(생성물이므로
      # content.js 와 같은 규칙이다 — 고치는 법은 `node tools/balance.js --write`).
      - name: Balance bands
        run: node tools/balance.js --check --quiet

      - name: Icons are deterministic
        run: |
          rm -rf "$RUNNER_TEMP/icons-committed"
          cp -R icons "$RUNNER_TEMP/icons-committed"
          python3 tools/make-icons.py
          rc=0
          if git diff --quiet -- icons/; then
            echo "icons regenerated byte-identical to the committed PNGs"
          else
            # Byte drift can come from a different zlib build alone. Fall back to a
            # pixel comparison: differing pixels fail, identical pixels only warn.
            node tools/validate.js --compare-icons "$RUNNER_TEMP/icons-committed" icons || rc=$?
          fi
          git checkout -- icons
          exit $rc

      - name: End-to-end tests
        timeout-minutes: 10
        # PUPPETEER_EXECUTABLE_PATH is deliberately left unset so puppeteer uses its
        # own Chrome for Testing download; suite C needs puppeteer >= 25 extensions.
        # CI=true makes test/e2e.js add --no-sandbox --disable-dev-shm-usage, which
        # GitHub-hosted Ubuntu runners require (unprivileged user namespaces are
        # restricted by AppArmor). Local runs keep the sandbox.
        #
        # The suite is four concurrent block lanes plus suites B and C (SPEC-test-speed §5):
        # 86 s locally, and the whole CI job measured 1 m 47 s. The budget was 420 s back when
        # the suite ran serially; 240 s is now generous and small enough that the runtime
        # assertion means something again. CRS_LANES is left at its default (min(4, cores-1)),
        # which a 4-core GitHub runner resolves to 3.
        env:
          CRS_TIME_BUDGET_MS: '240000'
        run: node test/e2e.js

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-out-${{ github.run_id }}
          path: test/out/
          retention-days: 7
          if-no-files-found: ignore
